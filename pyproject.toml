[project]
name = "sd-ai-command-pack"
version = "0.0.0"
description = "Repository tooling project; not a distributable package."
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Repository tooling only: an accidental `pip install .` must produce an
# empty distribution, so package auto-discovery (which would pick up
# installer/) stays disabled.
[tool.setuptools]
packages = []

[tool.uv]
package = false

[tool.ruff]
line-length = 88
extend-exclude = [
    ".agents",
    ".build",
    ".claude",
    ".codex",
    ".gemini",
    ".github/skills",
    ".obsidian-kb",
    ".opencode",
    ".ruff_cache",
    ".sd-ai-command-pack",
    ".venv",
    "node_modules",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
mypy_path = ".github/scripts"
