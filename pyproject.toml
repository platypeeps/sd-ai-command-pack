[project]
name = "sd-ai-command-pack"
version = "0.0.0"
description = "Repository tooling project; not a distributable package."
requires-python = ">=3.13"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Repository tooling only: an accidental `pip install .` must produce an
# empty distribution, so package auto-discovery stays disabled. There is no
# importable package here -- `bin/sd_install.py` is loaded by path, not
# imported -- and this must keep being true if one ever lands.
[tool.setuptools]
packages = []

[tool.uv]
package = false

# `lib/` and `tests/sd_db/` are `sd_db` as copied from the system checkout
# (sd:3278), which never ran Ruff over it. Excluded until it is linted on its
# own terms; `force-exclude` keeps the pre-commit hook's file arguments out too.
[tool.ruff]
line-length = 88
force-exclude = true
extend-exclude = [
    ".agents",
    ".build",
    ".claude",
    ".codex",
    ".gemini",
    ".obsidian-kb",
    ".opencode",
    ".ruff_cache",
    ".sd-ai-command-pack",
    ".venv",
    "lib",
    "node_modules",
    "tests/sd_db",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
mypy_path = ".github/scripts"
# bin/ ships executables with no .py suffix. Without this mypy names every one
# of them `__main__` and refuses the second as a duplicate module, so the
# second extensionless tool added to the lint target would be unlintable.
scripts_are_modules = true

# `markdown` is the research renderer's one third-party import, and it ships no
# stubs. Declared here rather than as an inline `# type: ignore`, because
# `warn_unused_ignores` above turns an inline one into a failure the day
# types-Markdown appears in the dev requirements -- a correction that would then
# be made in whichever pull request happened to add the stubs.
[[tool.mypy.overrides]]
module = ["markdown"]
ignore_missing_imports = true

# `sd_db` is the one database's library. It lives in `lib/`, outside mypy's
# path, and `make setup` builds a copy from it into this virtualenv, so
# whether mypy can see it depends on whether that ran. Declared
# here for the same reason `markdown` is -- an inline ignore in bin/sd_restore.py
# was correct on a machine without the library and, with `warn_unused_ignores`
# above, a lint failure on every machine with it.
[[tool.mypy.overrides]]
module = ["sd_db", "sd_db.*"]
ignore_missing_imports = true
