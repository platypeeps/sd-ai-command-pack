<!doctype html>
<!--
  GitHub (sd:5781), at /github: Today's GitHub and Issues views until sd:5781, in three views. Your issues and Intake
  moved to the Issues page (issues.html, pack sd:7682); github.js sends an old #view=issues or #view=intake there.
  Pull requests (sd:5608): /api/today/github, the operator's open pull requests and those merged or closed in the last
  7 days, from what sd shadow sync and the Contributions collector stored (today_github.document), read by
  today-github.js when the page opens on it and on Read again, one paged table (sd:5899). A row selects into Details (sd:5633).
  Dependabot (pack sd:7515): each managed repo's open Dependabot alerts, /api/github/dependabot, read by dependabot.js
  when the view first shows: a band per repo (the shell's fold) with Health's Fix, a row per alert with Open on GitHub.
  Tracked (pack sd:7525, Operations > Trackers until then): every open pull request and issue sd shadow sync keeps, of
  every tracker, watched and Jira rows too, /api/github/tracked, read by tracked.js when the view first shows.
  Refresh from GitHub, on every view, starts shadow-sync-nightly through the shared Run now (pack sd:6702);
  github.js draws the line.
  The page's styles are Today's (today.css) and the issue ledger's (issues.css): the rows moved, their look did not.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GitHub · system</title>
<link rel="stylesheet" href="/ui/fonts.css">
<link rel="stylesheet" href="/ui/tokens.css">
<script src="/ui/theme.js"></script>
<script src="/ui/markup.js"></script>
<link rel="stylesheet" href="/ui/shell.css">
<link rel="stylesheet" href="/ui/today.css">
<link rel="stylesheet" href="/ui/issues.css">
</head>
<body data-page="GitHub" data-scope="fleet">
<script src="/ui/icons.js"></script>
<div class="shell">
  <main>
    <header class="head">
      <div>
        <h1>GitHub</h1>
      </div>
    </header>
    <!-- The toolbar standard (sd:5281): row 1, the views then the shell's Shapeshift bar (sd:5539). -->
    <div class="toolbar" id="toolbar" data-shift></div>

    <div id="view-pulls" aria-label="Pull requests">
      <section aria-labelledby="github-h">
        <div class="sec-head">
          <h2 id="github-h">Pull requests <button class="help" type="button" aria-label="Help: Pull requests" data-help="&lt;b&gt;Your pull requests.&lt;/b&gt; Open pull requests that are yours, assigned to you or waiting on you, and every open one in a registered repo. Upstream is yours in a repo the workflow does not manage. Show mine, the default, keeps those assigned to you or opened by you; Show all adds the rest, a review asked of you among them. State open, the default, lists open ones; with closed adds those merged or closed in the last 7 days. Repo keeps the repos you pick, none picked keeps all. One group per repo, one open at a time: press a repo to open it and close the other. Newest GitHub activity first, 25 rows a page. Shows what the last GitHub sync saved; reading the page calls no GitHub API. Refresh from GitHub syncs in the background, then every view refreshes. Each row has Open on GitHub and a ⋯ menu of its other actions. Press a pull request for its details; Copilot review asks GitHub, once per press. Your issues and Issue Intake are on the Issues page.">
            <svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button></h2>
          <p class="tally" id="github-tally"></p>
          <div class="tools"><span id="pulls-sync"></span></div>
        </div>
        <div class="filters toolbar-2" id="github-filters"></div>
        <p class="why" id="pulls-said"></p>
        <div id="github-sections"><p class="st-line">Reading GitHub…</p></div>
      </section>
    </div>
    <div id="view-dependabot" aria-label="Dependabot" hidden>
      <section class="issues-sec" aria-labelledby="dependabot-h">
        <div class="sec-head">
          <h2 id="dependabot-h">Dependabot alerts <button class="help" type="button" aria-label="Help: Dependabot alerts" data-help="&lt;b&gt;Open Dependabot alerts.&lt;/b&gt; One group per managed repo, worst severity first; press a repo&#39;s name to fold its alerts. Each alert shows its severity, package, manifest, advisory and the version that fixes it. Open shows the alert on GitHub in a new tab, where you can dismiss it or open its pull request. Fix files a task in that repo (or reuses the open one) and opens a Claude session to fix it, as Health&#39;s Fix does. Shows the last GitHub sync: the first 100 alerts a repo, so a repo past that reads 100+. Repos with alerts off or not read are named under the table. Refresh from GitHub syncs in the background.">
            <svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button></h2>
          <p class="tally" id="dependabot-tally"></p>
          <div class="tools"><span id="dependabot-sync"></span></div>
        </div>
        <div class="filters toolbar-2" id="dependabot-filters"></div>
        <p class="why" id="dependabot-said"></p>
        <table class="ledger issues dependabot" aria-labelledby="dependabot-h" data-toolbar="dependabot-filters">
          <thead><tr><th scope="col">Severity</th><th scope="col">Package</th><th scope="col">Advisory</th><th scope="col">Opened</th><th scope="col"><span class="sr">Open</span></th></tr></thead>
          <tbody id="dependabot"><tr class="empty"><td colspan="5">Reading Dependabot alerts…</td></tr></tbody>
        </table>
        <p class="why" id="dependabot-notes"></p>
      </section>
    </div>
    <div id="view-tracked" aria-label="Tracked" hidden>
      <section class="issues-sec" aria-labelledby="tracked-h">
        <div class="sec-head">
          <h2 id="tracked-h">Tracked <button class="help" type="button" aria-label="Help: Tracked" data-help="&lt;b&gt;Everything the GitHub sync keeps open.&lt;/b&gt; Every open pull request and issue of every tracker, as of the last sync: watched repos, other people&#39;s pull requests elsewhere, and Jira issues nobody assigned to you, which the other views leave out. A GitHub row reads owner/name#N, a Jira row its ticket. External state is context and holds no local item open. Under the table, each tracker&#39;s last sync. Refresh from GitHub syncs in the background.">
            <svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button></h2>
          <p class="tally" id="tracked-tally"></p>
          <div class="tools"><span id="tracked-sync"></span></div>
        </div>
        <div class="filters toolbar-2" id="tracked-filters"></div>
        <p class="why" id="tracked-said"></p>
        <table class="ledger issues tracked" aria-labelledby="tracked-h" data-toolbar="tracked-filters">
          <thead><tr><th scope="col">Reference</th><th scope="col">Title</th><th scope="col">Repo or project</th><th scope="col">Kind</th><th scope="col">Author</th><th scope="col">Last seen</th></tr></thead>
          <tbody id="tracked"><tr class="empty"><td colspan="6">Reading tracked rows…</td></tr></tbody>
        </table>
        <p class="why" id="tracked-health"></p>
      </section>
    </div>
  </main>

  <div class="details" id="details"><p class="why">Press a pull request for its details.</p></div>
</div>
<script src="/ui/sections.js"></script>
<script src="/ui/commands.js"></script>
<script src="/ui/github.js"></script>
<script src="/ui/dependabot.js"></script>
<script src="/ui/tracked.js"></script>
<script src="/ui/today-github.js"></script>
<script src="/ui/shell.js"></script>
</body>
</html>
