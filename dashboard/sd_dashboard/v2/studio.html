<!doctype html>
<!--
  Studio (sd:6920, slice 2 of sd:6919), at /studio: the creative projects under REPO_ROOT, each a folder in a registered
  repository with a project.json, and each artifact root's files. Shape: docs/work/2026-10-31-studio/design.md.
  Data: /api/studio (studio.document: each project's kind, title, brief, item and roots, each root's files listed from
  disk; a project.json that does not parse, or a root that leaves its folder, lists with its reason), read when the page
  opens. Each file opens at /studio/files/<repo>/<path>, an image served sandboxed;
  audio and video, unsandboxed so they play (sd:7513), seek through a Range.
  Details draws the kind's stage strip (sd:6921); Next stage posts /api/items/<n>/stage with the revision read, and Pin
  and Hide post /api/studio/view, Documents' view state. The actions are slice 4 (sd:6922). sd:7490: an Updated column,
  and a row that expands, one at a time, into a sub-row per rendered file with Open and Re-render. Nothing here is sample data.
-->

<head>

<div class="shell">
  <main id="main">
    <header class="head">
      <div>
        <h1>Studio</h1>
        <p><span id="sub">Reading the projects…</span> · read from disk, each image served sandboxed</p>
      </div>
    </header>

    <div id="state" hidden></div>
    <!-- The toolbar standard (sd:5281): one control row, the shell's Shapeshift bar (sd:5539), which filters the ledger. -->
    <div class="toolbar" id="toolbar" data-shift></div>

    <section aria-labelledby="list-h">
      <div class="sec-head">
        <h2 id="list-h">Projects <button class="help" type="button" aria-label="Help: Projects" data-help="<b>One row per project.json</b> in a registered repository under the repositories folder. Kind is the file's: shirt, song or episode. <b>▲</b> means the file does not parse, names an unknown kind or role, or names a root outside its folder; that root is left out. <b>Updated</b> is the newest change to its project.json or a file it lists. The chevron opens one project at a time: a row per rendered file (selected, print, stickers, previews, media, and a song's final-video.mp4), with <b>Open</b> and, for a song, <b>Re-render</b>, which replaces the last render and keeps a backup. Enter opens Details, with the stage strip and each root's files: <b>Next stage</b> moves the project's sd item one stage, and a file's Pin and Hide change this page only.">
          <svg class="i" aria-hidden="true"><use href="#i-circle-help"/></svg></button></h2>
        <p class="tally" id="tally"></p>
      </div>
      <div class="filters toolbar-2" id="filters"></div>
      <table class="ledger" aria-labelledby="list-h" data-tfilter="page" data-toolbar="toolbar">
        <thead id="rows-head"></thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="empty" id="empty" hidden></p>
      <div id="pager"></div>
      <div id="help"></div>
    </section>
  </main>

  <div class="details" id="details"><p class="why">Select a project to see its brief and its files.</p></div>
