# SD AI Command Pack Gito project configuration.
#
# Gito reads this repo-local file from .gito/config.toml and merges it with
# Gito's bundled defaults. Keep provider selection and credentials in
# ~/.gito/.env or process environment variables, not in this committed file.

retries = 3

exclude_files = [
  ".github/**",
  ".claude/**",
  ".codex/**",
  ".gemini/**",
  ".opencode/**",
  ".agents/**",
  ".build/**",
  ".git/**",
  ".pytest_cache/**",
  ".obsidian-kb/**",
  # docs/work holds this repository's planning artifacts. The archive is bulk
  # history, so excluding it keeps a task-only change from drowning the review
  # scope, while active items and docs/spec stay reviewable.
  "docs/work/archive/**",
  ".ruff_cache/**",
  ".venv/**",
  ".sd-ai-command-pack/**",
  "node_modules/**",
]

[prompt_vars]
requirements = """
- This repository is the pack's source: `bin/`, `skills/`, `agents/` and `.claude/` are authored here, and a change to them changes the install contract of every repository that installs the pack.
- Prefer findings about behavior, security, data integrity, and maintainability over wording or style feedback.
"""
