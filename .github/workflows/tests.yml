name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.13"
          # 3.10 is gone. `sd_db` declares `requires-python = ">=3.13"`, and
          # two of this pack's verbs -- `sd restore` and `sd skill` -- read
          # the database through it, so a 3.10 leg could not install the
          # library and could not run their tests. Keeping the leg would have
          # meant a matrix row that tests less than the other one and a skip
          # gate with a hole in it, to advertise a floor the pack no longer
          # has. `pyproject.toml` and the README badge say 3.13 too.
          #
          # macOS is dropped for the duration of the artifacts-as-product
          # rollout (R11-D4). Restored at step 7, where "verify protection"
          # already sits on the checklist.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, not the default depth of one. Criterion 21 is
          # asserted against the commit that landed the `docs/work` retire --
          # tests/test_archive_untouched.py resolves it by asking which commit
          # added `docs/work/.status-source` -- and in a shallow clone that
          # commit is unreachable. The test fails there rather than skipping,
          # which is the right direction to fail and the reason this is set.
          # The other checkout in this file runs no unittest shard.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # `sd_db` is the one database's library. It lives in a second private
      # repository, is not vendored here and is not on any index, so this job
      # cannot run the suite without it: `tests/test_sd_skill.py` imports it
      # at module scope for hand-off 7's assertion, and
      # `tests/test_sd_restore.py` skips a class without it, which the skip
      # gate below is right to fail on.
      #
      # The destination is `~/repos/system` because that is
      # `sd_install.SYSTEM_CHECKOUT_DEFAULT`, not a path invented here. The
      # token is a secret the maintainer owns; `GITHUB_TOKEN` is scoped to
      # this repository and cannot read a sibling private one.
      #
      # The ref is a commit, not a branch, so a change over there cannot move
      # this suite's library underneath it. It moves when this pack starts
      # using something the old pin does not carry, and only then: the suite
      # fails on a skip, so a capability the library lacks is a red run here
      # rather than a quietly unexercised test. It last moved for the issue
      # collector sd:360 step 6 reads -- #306 reads an issue and its timeline,
      # #307 lets a contribution row hold one, #308 watches it -- none of which
      # `940c045a` carries. The move before that was for `Synced.queued` and
      # `Synced.incomplete`, which `sd shadow sync` forwards and `3c4c723a`
      # predates: a test constructing `Synced(queued=3)` passes on every local
      # venv and can only fail here, which is the asymmetry this pin creates
      # whenever it lags what the pack has started using.
      #
      # `758dfb4` carries no migration: `SCHEMA_VERSION` is 8 at both the old
      # pin and the new one, so this move says nothing about any database.
      - name: Check out the system checkout, for sd_db
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: platypeeps/system
          ref: 758dfb480e1b785a7f22644824f2d710a213cafe
          token: ${{ secrets.SYSTEM_REPO_TOKEN }}
          path: system-checkout
          persist-credentials: false

      - name: Put it where the installer looks
        shell: bash
        run: |
          mkdir -p "$HOME/repos"
          mv system-checkout "$HOME/repos/system"

      - name: Install test dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt

      # A built copy, never `-e`: an editable install would resolve into the
      # checkout above, and a branch switch there would change this pack's
      # library under its feet. That is B's criterion 1, and
      # `test_sd_skill.TheHarnessIsImportableHere` asserts it.
      - name: Install sd_db from that checkout
        run: python3 -m pip install "$HOME/repos/system/local-sd-db"

      - name: Run tests
        # Shards the suite by module across workers (coverage --parallel-mode
        # writes one data file per shard for the combine step below). The
        # runner sets the absolute coverage env so installer subprocesses
        # launched from temp cwds still load the config and land their shards
        # where combine finds them.
        shell: bash
        run: bash .github/scripts/run-tests.sh

      - name: Fail on skipped tests
        shell: bash
        run: |
          if grep -Eq 'skipped=[1-9][0-9]*' unittest-output.log; then
            echo "Tests skipped under CI; install required tools or make the skip explicit."
            exit 1
          fi

      - name: Combine coverage data
        run: python3 -m coverage combine

      - name: Report installer coverage (gate 100%)
        run: bash .github/scripts/check-installer-coverage.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not shallow: the docs lint's rule 2 asks git whether each open item
          # was delivered, and `delivered()` answers `unknown` for a shallow
          # clone, which rule 2 does not check. Full history is what makes the
          # reduced git coverage the comment below describes actually happen.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-security.txt

      # Both pinned sets in one resolve, which is also what `make setup` does.
      # The one package they share, pyyaml, is pinned to the same version and
      # hash in each file; `--require-hashes` would refuse the install if that
      # ever stopped being true, which is the right direction to fail.
      - name: Install lint and security dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt -r requirements-security.txt

      # Scope comes from the Makefile so there is exactly one definition of it.
      # This step used to restate the path list and had drifted: it covered no
      # bin/ file at all, so every tool added there was lint-clean locally and
      # unlinted here. Read the scope, do not restate it.
      - name: Ruff (pack Python)
        run: python3 -m ruff check $(make -s lint-ruff-paths)

      - name: Mypy (pack Python)
        run: python3 -m mypy $(make -s lint-mypy-paths)

      # The docs lint runs here and not in the unittest job: the tests lint
      # fixture repositories they build, never this checkout's own docs/work.
      # It reads sd_lib and the tree, so the lint job's dependencies suffice.
      # No runner has the database, so rule 2 reads each open item's status
      # from git here and checks fewer items than `make check` does on a
      # machine with the rows; the run's `rule 2 status source:` line says
      # which happened. Installing sd_db would not change that: a library
      # with no database file to open answers the same way.
      - name: Docs lint (docs/work, docs/spec, docs/decisions)
        run: python3 bin/sd-docs-lint

      # The three steps below were the `security` job until sd:10 criterion 17
      # folded them in here. Same commands, same pins, same scanner set; what
      # changed is that they no longer pay a second checkout, a second Python
      # and a second dependency install to run for well under a minute. The
      # same change removed the `bash 3.2 syntax` job from this file: it built
      # bash 3.2 from source to parse this repository's own three scripts under
      # `.github/scripts/`, a premise that stopped being true when the shipped
      # shell was deleted. No job here runs that gate now; `make lint` still
      # parses the three scripts with `/bin/bash` on the maintainer's macOS,
      # which is the interpreter the check was ever about.
      #
      # Scans pack-owned Python only. After step 3e that is bin/: nothing is
      # shipped into consumer repos any more, so "shipped Python" and "the
      # tools this repo owns" became the same set. The unshipped test suite
      # stays out of scope; the gate blocks on medium+ severity so
      # subprocess-to-git/gh Low findings stay advisory.
      - name: Bandit (pack Python)
        run: bandit -q -r --severity-level medium bin

      - name: Zizmor (workflow security)
        run: zizmor --offline .github/workflows/

      # Consumers vendor ~6k lines of pack shell and exempt it from line
      # review ("reviewed upstream"), so upstream lint rigor is the
      # compensating control. Warning severity is the achieved baseline;
      # keep it there.
      # `--deduplicate`: an unmerged path is listed once per merge stage, which
      # would lint one script three times and print each finding three times.
      # CI checks out a merged tree so this lane does not meet a conflict, but
      # the line is copied into local sweeps that do (item 481).
      - name: Shellcheck (pack shell)
        run: git ls-files -z --deduplicate '*.sh' | xargs -0 shellcheck -S warning

      # A report, never a gate. R11-D48 retired `bin/`'s line-count ceiling
      # because a total that has to be raised to let work proceed never says
      # no; what replaced it is four numbers and their movement, printed where
      # whoever reads the pull request will see them. `continue-on-error` is
      # the mechanical half of "never a gate": this step cannot redden a run
      # even by crashing, so nobody is ever tempted to make its numbers
      # agreeable. It runs in this job rather than the unittest one because
      # the trend reads thirty days of history and this is the checkout with
      # `fetch-depth: 0` and no matrix.
      - name: Report bin/ size (never a gate)
        continue-on-error: true
        run: python3 bin/sd-size-report | tee -a "$GITHUB_STEP_SUMMARY"
