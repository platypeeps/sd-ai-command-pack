name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci-scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      reason: ${{ steps.classify.outputs.reason }}
      before_sha: ${{ steps.classify.outputs.before_sha }}
      after_sha: ${{ steps.classify.outputs.after_sha }}
      validation_mode: ${{ steps.classify.outputs.validation_mode }}
      evidence_run_id: ${{ steps.classify.outputs.evidence_run_id }}
      evidence_check_run_id: ${{ steps.classify.outputs.evidence_check_run_id }}
      evidence_scope: ${{ steps.classify.outputs.evidence_scope }}

    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Pin the Node major that runs review-preflight.mjs instead of taking
      # whatever the runner image ships. Node 22 is in the image tool cache,
      # so this resolves locally and adds no download to the fast lane.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Classify exact-head CI scope
        id: classify
        env:
          AFTER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PROTECTED_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail

          result_file="$RUNNER_TEMP/bookkeeping-ci-scope.json"
          classifier_file="$RUNNER_TEMP/bookkeeping-ci-scope.py"
          runs_file="$RUNNER_TEMP/bookkeeping-ci-runs.json"
          checks_file="$RUNNER_TEMP/bookkeeping-ci-checks.json"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            evidence_scope="pull_request:${PR_NUMBER:-unknown}"
          else
            evidence_scope="ref:${PROTECTED_REF:-unknown}"
          fi

          write_full_result() {
            local reason="$1"
            jq -cn \
              --arg before "$BEFORE_SHA" \
              --arg after "$AFTER_SHA" \
              --arg reason "$reason" \
              --arg scope "$evidence_scope" \
              '{
                schemaVersion: 1,
                kind: "bookkeeping-ci-scope",
                mode: "full",
                reasonCode: $reason,
                beforeSha: (if ($before | test("^[0-9a-f]{40}$")) then $before else null end),
                afterSha: (if ($after | test("^[0-9a-f]{40}$")) then $after else null end),
                evidenceRunId: null,
                evidenceCheckRunId: null,
                evidenceScope: $scope,
                validationMode: "none",
                commitCount: 0,
                changedPaths: [],
                disallowedPaths: []
              }' >"$result_file"
          }

          publish_result() {
            jq -e \
              --arg before "$BEFORE_SHA" \
              --arg after "$AFTER_SHA" \
              '.schemaVersion == 1
               and .kind == "bookkeeping-ci-scope"
               and (.mode == "full" or .mode == "bookkeeping")
               and ((.reasonCode | type) == "string")
               and (.reasonCode | test("^[a-z0-9_]{1,80}$"))
               and (.validationMode == "none" or .validationMode == "planning" or .validationMode == "completion")
               and ((.evidenceScope | type) == "string")
               and (.evidenceScope | test("^[A-Za-z0-9_:/.-]{1,160}$"))
               and (if .mode == "bookkeeping" then .beforeSha == $before and .afterSha == $after else true end)
               and (if .mode == "bookkeeping" then .evidenceRunId != null and .evidenceCheckRunId != null else true end)
               and (.evidenceRunId == null or (((.evidenceRunId | type) == "number") and .evidenceRunId > 0 and .evidenceRunId == (.evidenceRunId | floor)))
               and (.evidenceCheckRunId == null or (((.evidenceCheckRunId | type) == "number") and .evidenceCheckRunId > 0 and .evidenceCheckRunId == (.evidenceCheckRunId | floor)))' \
              "$result_file" >/dev/null
            {
              printf 'mode=%s\n' "$(jq -r '.mode' "$result_file")"
              printf 'reason=%s\n' "$(jq -r '.reasonCode' "$result_file")"
              printf 'before_sha=%s\n' "$(jq -r '.beforeSha // ""' "$result_file")"
              printf 'after_sha=%s\n' "$(jq -r '.afterSha // ""' "$result_file")"
              printf 'validation_mode=%s\n' "$(jq -r '.validationMode' "$result_file")"
              printf 'evidence_run_id=%s\n' "$(jq -r '.evidenceRunId // ""' "$result_file")"
              printf 'evidence_check_run_id=%s\n' "$(jq -r '.evidenceCheckRunId // ""' "$result_file")"
              printf 'evidence_scope=%s\n' "$(jq -r '.evidenceScope' "$result_file")"
            } >>"$GITHUB_OUTPUT"
          }

          select_full() {
            write_full_result "$1"
            publish_result
            exit 0
          }

          write_full_result "bootstrap_full"
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" != "synchronize" ]; then
            select_full "pull_request_action_not_synchronize"
          fi
          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "push" ]; then
            select_full "event_not_supported"
          fi
          if ! [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! [[ "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            select_full "event_commit_identity_invalid"
          fi

          if ! classifier_record="$(git ls-tree "$BEFORE_SHA" -- .github/scripts/bookkeeping_ci_scope.py 2>/dev/null)"; then
            select_full "prior_classifier_unavailable"
          fi
          if [ -z "$classifier_record" ]; then
            select_full "prior_classifier_missing"
          fi
          read -r classifier_mode classifier_type _ classifier_path <<<"$classifier_record"
          if [ "$classifier_mode" != "100644" ] || [ "$classifier_type" != "blob" ] || [ "$classifier_path" != ".github/scripts/bookkeeping_ci_scope.py" ]; then
            select_full "prior_classifier_unsafe"
          fi
          # On a pull_request, BEFORE_SHA is the PR's own previous head and is
          # author-controlled, so the blob below is only trusted when it is
          # identical to the base branch's. Identity must be positively
          # established: an absent or unresolvable base fails closed too.
          # BASE_SHA must stay non-empty-checked -- "git rev-parse ':path'" with
          # an empty prefix is a valid index lookup that exits 0.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ -z "$BASE_SHA" ]; then
              select_full "prior_classifier_identity_unavailable"
            fi
            if ! before_blob="$(git rev-parse "$BEFORE_SHA:.github/scripts/bookkeeping_ci_scope.py" 2>/dev/null)"; then
              select_full "prior_classifier_identity_unavailable"
            fi
            if ! base_blob="$(git rev-parse "$BASE_SHA:.github/scripts/bookkeeping_ci_scope.py" 2>/dev/null)"; then
              select_full "prior_classifier_identity_unavailable"
            fi
            if [ "$before_blob" != "$base_blob" ]; then
              select_full "prior_classifier_not_base_identical"
            fi
          fi

          if ! git show "$BEFORE_SHA:.github/scripts/bookkeeping_ci_scope.py" >"$classifier_file"; then
            select_full "prior_classifier_unavailable"
          fi
          if ! PYTHONPYCACHEPREFIX="$RUNNER_TEMP/python-cache" python3 -m py_compile "$classifier_file"; then
            select_full "prior_classifier_invalid"
          fi

          evidence_available=1
          if ! gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?head_sha=${BEFORE_SHA}&status=completed&per_page=20" \
            >"$runs_file"; then
            evidence_available=0
            printf '%s\n' '{"workflow_runs":[]}' >"$runs_file"
          fi
          if ! gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${BEFORE_SHA}/check-runs?per_page=100" \
            >"$checks_file"; then
            evidence_available=0
            printf '%s\n' '{"check_runs":[]}' >"$checks_file"
          fi

          classifier_args=(
            --repo .
            --event-name "$EVENT_NAME"
            --event-action "$EVENT_ACTION"
            --before-sha "$BEFORE_SHA"
            --after-sha "$AFTER_SHA"
            --protected-ref "$PROTECTED_REF"
            --runs-json "$runs_file"
            --checks-json "$checks_file"
          )
          if [ -n "$PR_NUMBER" ]; then
            classifier_args+=(--pr-number "$PR_NUMBER")
          fi
          if [ "$evidence_available" -eq 1 ]; then
            classifier_args+=(--evidence-available)
          else
            classifier_args+=(--no-evidence-available)
          fi
          python3 "$classifier_file" "${classifier_args[@]}" >"$result_file"
          publish_result

      # c8 coverage-measures the review-preflight.mjs invocations below.
      # The event-head validation runs on every head regardless of mode,
      # so the tooling installs unconditionally (lockfile-pinned npm ci).
      - name: Install review preflight coverage tooling
        id: install-review-preflight-coverage-tooling
        run: npm ci

      # Validate the event head's content in EVERY mode. Mode decides which
      # expensive jobs run; it does not decide whether content is validated.
      # Base semantics, per event:
      # - pull_request: the PR's own base (github.event.pull_request.base.sha).
      #   The preflight turns the base into a three-dot `diff <base>...HEAD`,
      #   so this yields the merge-base diff — the pull request's diff,
      #   covering every push on the PR, not just the newest one.
      # - push: github.event.before — the pushed range (stated, not inherited).
      # - No fallback base: an unverifiable base FAILS this step. Substituting
      #   the head itself would validate an empty diff (fail-open), and an
      #   unset base would hand resolution to a discovery chain whose last
      #   resort is an arbitrary sorted remote ref.
      # A head touching none of the validated paths passes: the diff-scoped
      # checks report "no changed ... require" pass lines on an empty set,
      # and the repo-wide checks (package.json, documentation references,
      # completed-task location) run against the checkout as always.
      - name: Validate event head
        id: validate-event-head
        env:
          AFTER_SHA: ${{ steps.classify.outputs.after_sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          # The pinned-SHA checkout never establishes origin/HEAD, so the
          # root-task base_branch rule cannot discover the default branch;
          # state it explicitly from the event payload.
          SD_AI_COMMAND_PACK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "${EVENT_BASE_SHA}^{commit}" >/dev/null; then
            printf 'error: event base %s does not resolve to a commit; failing closed rather than validating an empty or arbitrary diff window.\n' \
              "${EVENT_BASE_SHA:-<empty>}" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ] && ! git merge-base --is-ancestor "$EVENT_BASE_SHA" "$AFTER_SHA"; then
            printf 'error: push base %s is not an ancestor of %s (force push?); the pushed-range claim would be false. Failing closed.\n' \
              "$EVENT_BASE_SHA" "$AFTER_SHA" >&2
            exit 1
          fi

          git diff --check "$EVENT_BASE_SHA...$AFTER_SHA" -- .trellis/tasks .trellis/workspace

          # Coverage-instrument every review-preflight.mjs invocation into
          # one shared V8 raw-coverage directory: --clean=false keeps each
          # run's data instead of the next invocation wiping the previous
          # one. "npm exec --no" refuses to fall back to an unpinned
          # registry fetch if the lockfile-pinned local install is missing,
          # failing loudly instead. The "Report review preflight coverage"
          # step below combines and publishes the merged number; its gate
          # reads coverage_expected, emitted here immediately before the
          # first instrumented invocation, so the zero-line guard fires
          # only on runs where instrumentation was actually attempted.
          c8_temp_dir="$RUNNER_TEMP/c8-review-preflight"
          mkdir -p "$c8_temp_dir"
          c8_run=(npm exec --no -- c8 --clean=false --reporter=none --temp-directory="$c8_temp_dir" --include="scripts/sd-ai-command-pack-review-preflight.mjs")
          printf 'coverage_expected=true\n' >>"$GITHUB_OUTPUT"

          SD_AI_COMMAND_PACK_REVIEW_PREFLIGHT_BASE_REF="$EVENT_BASE_SHA" \
            "${c8_run[@]}" node scripts/sd-ai-command-pack-review-preflight.mjs

      # The final-bundle validation stays bookkeeping-only: it certifies the
      # finalization delta between consecutive trusted heads, which is an
      # incremental question — the PR base would be the wrong window here.
      - name: Validate bookkeeping head
        id: bookkeeping-validation
        if: steps.classify.outputs.mode == 'bookkeeping'
        env:
          AFTER_SHA: ${{ steps.classify.outputs.after_sha }}
          BEFORE_SHA: ${{ steps.classify.outputs.before_sha }}
          VALIDATION_MODE: ${{ steps.classify.outputs.validation_mode }}
          # Same rationale as the event-head step: the pinned-SHA checkout
          # has no origin/HEAD for default-branch discovery.
          SD_AI_COMMAND_PACK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          # Shell variables do not cross steps: re-declare the c8 plumbing
          # byte-identical to the event-head step's so both steps' raw
          # coverage lands in the same shared directory.
          c8_temp_dir="$RUNNER_TEMP/c8-review-preflight"
          mkdir -p "$c8_temp_dir"
          c8_run=(npm exec --no -- c8 --clean=false --reporter=none --temp-directory="$c8_temp_dir" --include="scripts/sd-ai-command-pack-review-preflight.mjs")

          case "$VALIDATION_MODE" in
            none)
              ;;
            completion|planning)
              receipt="$RUNNER_TEMP/bookkeeping-final-bundle.json"
              "${c8_run[@]}" node scripts/sd-ai-command-pack-review-preflight.mjs \
                final-bundle --mode "$VALIDATION_MODE" \
                --base "$BEFORE_SHA" --head "$AFTER_SHA" --json >"$receipt"
              jq -e \
                --arg mode "$VALIDATION_MODE" \
                --arg head "$AFTER_SHA" \
                '.schemaVersion == 1
                 and .status == "valid"
                 and .mode == $mode
                 and .evidence.headOid == $head
                 and .reasonCodes == [($mode + "_bundle_valid")]' \
                "$receipt" >/dev/null
              ;;
            *)
              printf '%s\n' "Unrecognized bookkeeping validation mode." >&2
              exit 1
              ;;
          esac

      # Runs in BOTH modes: the event-head validation always instruments
      # the preflight, so the zero-line guard below now protects every run.
      # coverage_expected keeps this reporter from firing on runs that
      # failed before instrumentation was attempted (checkout, npm ci, the
      # base guard), where a zero-line report would misdiagnose the real
      # failure as broken coverage plumbing.
      - name: Report review preflight JavaScript coverage
        id: report-review-preflight-coverage
        if: steps.validate-event-head.outputs.coverage_expected == 'true' && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          c8_temp_dir="$RUNNER_TEMP/c8-review-preflight"
          report_dir="$RUNNER_TEMP/c8-review-preflight-report"
          mkdir -p "$c8_temp_dir"
          npm exec --no -- c8 report \
            --temp-directory="$c8_temp_dir" \
            --include="scripts/sd-ai-command-pack-review-preflight.mjs" \
            --reporter=text --reporter=json-summary \
            --reports-dir="$report_dir"

          summary="$report_dir/coverage-summary.json"
          total_lines=$(jq -r '.total.lines.total' "$summary")
          covered_lines=$(jq -r '.total.lines.covered' "$summary")
          pct=$(jq -r '.total.lines.pct' "$summary")

          # Hard gate: a c8 invocation that instruments no files still exits
          # 0 and reports 0/0, which looks like success. Fail loudly instead
          # of publishing a silent zero over 4,700+ lines.
          if ! jq -e '.total.lines.total > 0 and .total.lines.covered > 0' "$summary" >/dev/null; then
            printf 'error: c8 measured zero lines for scripts/sd-ai-command-pack-review-preflight.mjs (total=%s covered=%s). Coverage plumbing is broken, not merely unexercised code.\n' \
              "$total_lines" "$covered_lines" >&2
            exit 1
          fi

          printf 'review-preflight.mjs coverage: %s%% (%s/%s lines)\n' "$pct" "$covered_lines" "$total_lines"

          {
            printf '%s\n' "## Review preflight JavaScript coverage"
            printf '%s\n' "- File: scripts/sd-ai-command-pack-review-preflight.mjs"
            printf '%s\n' "- Lines: ${covered_lines}/${total_lines} (${pct}%)"
            printf '%s\n' "- No coverage floor is enforced yet; this step publishes a measured baseline."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Summarize CI scope
        if: always()
        env:
          AFTER_SHA: ${{ steps.classify.outputs.after_sha }}
          BEFORE_SHA: ${{ steps.classify.outputs.before_sha }}
          EVIDENCE_CHECK_RUN_ID: ${{ steps.classify.outputs.evidence_check_run_id }}
          EVIDENCE_RUN_ID: ${{ steps.classify.outputs.evidence_run_id }}
          EVIDENCE_SCOPE: ${{ steps.classify.outputs.evidence_scope }}
          MODE: ${{ steps.classify.outputs.mode }}
          REASON: ${{ steps.classify.outputs.reason }}
          VALIDATION_MODE: ${{ steps.classify.outputs.validation_mode }}
          VALIDATION_OUTCOME: ${{ steps.bookkeeping-validation.outcome }}
          EVENT_HEAD_OUTCOME: ${{ steps.validate-event-head.outcome }}
        shell: bash
        run: |
          {
            printf '%s\n' "## CI scope"
            printf '%s\n' "- Mode: ${MODE:-unknown}"
            printf '%s\n' "- Reason: ${REASON:-unavailable}"
            printf '%s\n' "- Heads: ${BEFORE_SHA:-unavailable} -> ${AFTER_SHA:-unavailable}"
            printf '%s\n' "- Prior evidence: ${EVIDENCE_SCOPE:-none}; run ${EVIDENCE_RUN_ID:-none}; check ${EVIDENCE_CHECK_RUN_ID:-none}"
            printf '%s\n' "- Event-head validation: ${EVENT_HEAD_OUTCOME:-not-run}"
            printf '%s\n' "- Bookkeeping validation: ${VALIDATION_MODE:-none} (${VALIDATION_OUTCOME:-not-run})"
            if [ "${MODE:-}" = "bookkeeping" ] && [ "${VALIDATION_OUTCOME:-}" = "success" ]; then
              printf '%s\n' "- Expensive jobs avoided: unittest matrix, lint, security, release payload"
            else
              printf '%s\n' "- Full CI selected; no cost savings claimed."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  unittest:
    needs: ci-scope
    if: needs.ci-scope.outputs.mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt

      - name: Run tests
        # Shards the suite by module across workers (coverage --parallel-mode
        # writes one data file per shard for the combine step below). The
        # runner sets the absolute coverage env so installer subprocesses
        # launched from temp cwds still load the config and land their shards
        # where combine finds them.
        shell: bash
        run: bash .github/scripts/run-tests.sh

      - name: Fail on skipped tests
        shell: bash
        run: |
          if grep -Eq 'skipped=[1-9][0-9]*' unittest-output.log; then
            echo "Tests skipped under CI; install required tools or make the skip explicit."
            exit 1
          fi

      - name: Combine coverage data
        run: python3 -m coverage combine

      - name: Report installer coverage (gate 100%)
        run: python3 -m coverage report --include="install.py,installer/*" --fail-under=100

      - name: Report shipped-scripts coverage
        run: bash .github/scripts/check-shipped-script-coverage.sh

      - name: Check shipped-script doc coverage
        run: bash .github/scripts/check-shipped-script-docs.sh

  shell-coverage:
    name: Shell coverage
    needs: ci-scope
    if: needs.ci-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    # kcov wraps every bash the suite spawns, so the run is ~10 min plus the
    # from-source kcov build; give it headroom over the standard 15.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt

      - name: Install kcov
        # kcov is no longer packaged for Ubuntu 24.04, and the prebuilt v42
        # binary links libopcodes-2.38 (binutils 2.38), absent on noble
        # (binutils 2.42). Build from a pinned kcov commit instead so the
        # binary is ABI-correct for whatever runner image is current. The
        # clone is pinned by asserting HEAD equals the expected commit, and
        # `kcov --version` smoke-tests the built binary.
        env:
          KCOV_REPO: https://github.com/SimonKagstrom/kcov.git
          KCOV_REF: v43
          KCOV_COMMIT: a39874f938ce13f7a65f253120d1ec946b349ffe
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            binutils-dev libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev libssl-dev
          git clone --depth 1 --branch "$KCOV_REF" "$KCOV_REPO" /tmp/kcov-src
          got="$(git -C /tmp/kcov-src rev-parse HEAD)"
          if [ "$got" != "$KCOV_COMMIT" ]; then
            printf 'error: kcov %s resolved to %s, expected %s\n' \
              "$KCOV_REF" "$got" "$KCOV_COMMIT" >&2
            exit 1
          fi
          cmake -S /tmp/kcov-src -B /tmp/kcov-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov-build
          sudo cmake --install /tmp/kcov-build
          kcov --version

      - name: Measure shipped shell coverage
        # Routes the bash the subprocess tests spawn through kcov-bash-shim.sh
        # so kcov records which lines of the shipped shell the suite reaches.
        # This is a measurement-only lane: no floor is enforced (measure before
        # gating), and the report step fails only on a zero-line measurement.
        env:
          SD_AI_COMMAND_PACK_TEST_BASH: ${{ github.workspace }}/.github/scripts/kcov-bash-shim.sh
          SD_AI_COMMAND_PACK_REAL_BASH: /usr/bin/bash
          SD_AI_COMMAND_PACK_KCOV_DIR: ${{ runner.temp }}/kcov-shell
          SD_AI_COMMAND_PACK_KCOV_INCLUDE: sd-ai-command-pack-
        run: |
          set -euo pipefail
          mkdir -p "$SD_AI_COMMAND_PACK_KCOV_DIR"
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Report shipped shell coverage
        if: always()
        env:
          SD_AI_COMMAND_PACK_KCOV_DIR: ${{ runner.temp }}/kcov-shell
        run: bash .github/scripts/report-shell-coverage.sh

  lint:
    needs: ci-scope
    if: needs.ci-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install lint dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt

      - name: Ruff (pack Python)
        run: python3 -m ruff check install.py installer scripts templates/scripts tests .github/scripts/check-command-surface-drift.py .github/scripts/bookkeeping_ci_scope.py .github/scripts/generate-plugin.py .github/scripts/partition-surfaces.py .github/scripts/summarize_shell_coverage.py

      # Mirrors the Makefile lint target's mypy scope: installer/, the
      # install.py facade, and shipped scripts/*.py. templates/scripts/
      # twins stay excluded (byte-identical mirrors; duplicate script
      # names would collide in one mypy run).
      - name: Mypy (pack Python)
        run: python3 -m mypy installer install.py scripts .github/scripts/check-command-surface-drift.py .github/scripts/bookkeeping_ci_scope.py .github/scripts/generate-plugin.py .github/scripts/partition-surfaces.py .github/scripts/summarize_shell_coverage.py

      - name: Review preflight JavaScript syntax
        run: |
          node --check scripts/sd-ai-command-pack-review-preflight.mjs
          node --check templates/scripts/sd-ai-command-pack-review-preflight.mjs

      - name: OpenCode JavaScript syntax
        run: bash .github/scripts/check-opencode-js.sh

  security:
    needs: ci-scope
    if: needs.ci-scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-security.txt

      - name: Install security scanners
        run: python3 -m pip install --require-hashes -r requirements-security.txt

      # Scans pack-owned shipped Python only. Trellis-vendored hook adapters
      # and the unshipped test suite are out of scope; the gate blocks on
      # medium+ severity so subprocess-to-git/gh Low findings stay advisory.
      - name: Bandit (shipped Python)
        run: bandit -q -r --severity-level medium install.py installer scripts templates/scripts

      - name: Zizmor (workflow security)
        run: zizmor --offline .github/workflows/

      # Consumers vendor ~6k lines of pack shell and exempt it from line
      # review ("reviewed upstream"), so upstream lint rigor is the
      # compensating control. Warning severity is the achieved baseline;
      # keep it there.
      - name: Shellcheck (pack shell and hooks)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning .githooks/pre-push

  release-payload-gate:
    name: Release payload gate
    needs: ci-scope
    if: needs.ci-scope.outputs.mode == 'full' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run release payload gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git cat-file -e "${BASE_SHA}^{commit}"
          SD_AI_COMMAND_PACK_FULL_CHECK_TEST_SOURCE=1 \
          SD_AI_COMMAND_PACK_FULL_CHECK_RELEASE_BASE_REF="${BASE_SHA}" \
          bash -c 'source scripts/sd-ai-command-pack-full-check.sh; run_pack_source_drift_gates'

  main-push-scope:
    name: Main push scope
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out pushed history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject non-chore direct main pushes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          reviewed_pr_merge=0
          if ! git rev-parse --verify --quiet "${GITHUB_SHA}^2" >/dev/null; then
            reviewed_pr_count="$(
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" |
                jq --arg sha "$GITHUB_SHA" --arg base "$GITHUB_REF_NAME" \
                  '[.[] | select(.merged_at != null and .merge_commit_sha == $sha and .base.ref == $base)] | length'
            )"
            case "$reviewed_pr_count" in
              ''|*[!0-9]*)
                echo "GitHub returned invalid pull-request merge evidence; failing closed." >&2
                exit 1
                ;;
            esac
            if [ "$reviewed_pr_count" -gt 0 ]; then
              reviewed_pr_merge=1
            fi
          fi
          SD_AI_COMMAND_PACK_MAIN_PUSH_PR_MERGE="$reviewed_pr_merge" \
            bash .github/scripts/check-main-push-scope.sh \
              "${{ github.event.before }}" "${{ github.sha }}"

  # Single aggregate context for branch protection, matching the fleet
  # convention: protection requires only "CI Result" so matrix or lane
  # changes never strand a PR waiting on a renamed context.
  ci-result:
    name: CI Result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ci-scope, unittest, lint, security, release-payload-gate, main-push-scope]
    if: always()
    outputs:
      mode: ${{ steps.evaluate.outputs.mode }}

    steps:
      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Evaluate required lanes
        id: evaluate
        env:
          CI_SCOPE_MODE: ${{ needs.ci-scope.outputs.mode }}
          CI_SCOPE_REASON: ${{ needs.ci-scope.outputs.reason }}
          CI_SCOPE_RESULT: ${{ needs.ci-scope.result }}
          EVENT_NAME: ${{ github.event_name }}
          UNITTEST_RESULT: ${{ needs.unittest.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          RELEASE_PAYLOAD_GATE_RESULT: ${{ needs.release-payload-gate.result }}
          MAIN_PUSH_SCOPE_RESULT: ${{ needs.main-push-scope.result }}
        run: |
          bash .github/scripts/check-ci-result.sh \
            "$EVENT_NAME" "$CI_SCOPE_RESULT" "$CI_SCOPE_MODE" \
            "$UNITTEST_RESULT" "$LINT_RESULT" "$SECURITY_RESULT" \
            "$RELEASE_PAYLOAD_GATE_RESULT" "$MAIN_PUSH_SCOPE_RESULT"
          printf 'mode=%s\n' "$CI_SCOPE_MODE" >>"$GITHUB_OUTPUT"
          printf 'CI mode: %s (%s)\n' "$CI_SCOPE_MODE" "$CI_SCOPE_REASON" >>"$GITHUB_STEP_SUMMARY"

  auto-tag-release:
    name: Auto-tag release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: ci-result
    # !cancelled() suppresses the implicit success() status check, which
    # evaluates over the TRANSITIVE needs chain: release-payload-gate is
    # PR-only, so it is skipped on every main push, and implicit success()
    # then silently skips this job (v0.13.2-v0.14.0 shipped untagged before
    # this guard). ci-result (if: always()) already validates every lane.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-result.result == 'success' && needs.ci-result.outputs.mode == 'full' }}
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create manifest version tag
        env:
          BASE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python3 .github/scripts/create-release-tag.py
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --repository "$GITHUB_REPOSITORY"
