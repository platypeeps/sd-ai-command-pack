name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.14"
          # 3.10 is gone. `sd_db` declares `requires-python = ">=3.13"`, and
          # two of this pack's verbs -- `sd restore` and `sd skill` -- read
          # the database through it, so a 3.10 leg could not install the
          # library and could not run their tests. Keeping the leg would have
          # meant a matrix row that tests less than the other one and a skip
          # gate with a hole in it, to advertise a floor the pack no longer
          # has. `pyproject.toml` and the README badge keep 3.13 as the floor;
          # the one leg runs 3.14, the latest stable, because the pack tests
          # one version per language (operator decision 2026-09-26). Moving
          # the leg renames this job's status context, so branch protection
          # must require the new name before a pull request can merge.
          #
          # macOS is dropped for the duration of the artifacts-as-product
          # rollout (R11-D4). Restored at step 7, where "verify protection"
          # already sits on the checklist.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, not the default depth of one. Criterion 21 is
          # asserted against the commit that landed the `docs/work` retire --
          # tests/test_archive_untouched.py resolves it by asking which commit
          # added `docs/work/.status-source` -- and in a shallow clone that
          # commit is unreachable. The test fails there rather than skipping,
          # which is the right direction to fail and the reason this is set.
          # The other checkout in this file runs no unittest shard.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # `sd_db` is the one database's library. It lives in a second private
      # repository, is not vendored here and is not on any index, so this job
      # cannot run the suite without it: `tests/test_sd_skill.py` imports it
      # at module scope for hand-off 7's assertion, and
      # `tests/test_sd_restore.py` skips a class without it, which the skip
      # gate below is right to fail on.
      #
      # The destination is `~/repos/system` because that is
      # `sd_install.SYSTEM_CHECKOUT_DEFAULT`, not a path invented here. The
      # token is a secret the maintainer owns; `GITHUB_TOKEN` is scoped to
      # this repository and cannot read a sibling private one.
      #
      # The ref is a commit, not a branch, so a change over there cannot move
      # this suite's library underneath it. It moves when this pack starts
      # using something the old pin does not carry, and only then: the suite
      # fails on a skip, so a capability the library lacks is a red run here
      # rather than a quietly unexercised test. It last moved for sd:719
      # (system main after #411, `4b240d28`), the one exception so far to
      # that rule: no pack test is red at `9d86f092` and green here, and
      # nothing in `bin/` imports what the range adds (`ledger`, the
      # `removal` surface), though three commits change `reporting`
      # behind the calls `bin/sd_controls.py` makes, named below. It moves
      # for parity, not capability: the operator's venv is installed from
      # system main (sd:962, #403, `c248d82`: the dashboard refuses to
      # start when the installed `sd_db` lacks the checkout's library
      # commit), so the library this suite runs against is the one the
      # operator runs. The move is migration-free: `9d86f092..4b240d28`
      # touches neither `sd_db/schema.py` nor anything under `sd_db/schema`,
      # and `SCHEMA_VERSION` stays 9. Of the seventeen commits in that
      # range, seven change `sd_db`, and the ones that could reach a pack
      # test are the three in `reporting`: `bin/sd_controls.py` calls its
      # `ingest`, `acknowledge`, `ingest_log` and `reports`, and
      # `tests/test_sd_controls.py` runs them against a real store. A
      # report whose `fields` is absent or unreadable has one meaning,
      # `reporting.UNREADABLE_FIELDS`, at retention, the bulk clean, the
      # backlog and the page (sd:873, #395, `34eef64`; also `reads` and
      # `retention`), a run that repeats an open attention report folds
      # into it with a count (sd:920, #398, `5e2f58a`), and a folded run's
      # replay after the acknowledge answers with the done report (sd:955,
      # #401, `8aa750e`). The four calls keep their signatures. The other
      # four change only what nothing in `bin/` imports: `removal`
      # (sd:795, #399, `a24b6a7`; sd:956, #400, `660ec6c`; sd:754, #407,
      # `20c9497`) and the new `ledger` (sd:234, #406, `4b240d2`), which
      # `sd_db.__init__` re-exports. The rest do not touch `sd_db`: #403,
      # #404, #405 and #411 change the dashboard and the citation gate, and
      # `reporting.acknowledge_clean`, which #405's page calls, has been in
      # the library since sd:755 (#347), below `9d86f092`.
      #
      # The move before that was for sd:941
      # (#394, `635764e`, pinned at `9d86f092`): `reporting.acknowledge`
      # takes `resolve_ingest_followups`, keyword-only and exactly a bool,
      # and True resolves the followup the ingest itself wrote in the same
      # transaction as the transition. sd:941's own pull request, which
      # this pin precedes, adds `sd reports acknowledge
      # --resolve-ingest-followups` to pass it and the flag tests in
      # `tests/test_sd_controls.py` that run it through a real store;
      # `09260ad4` refuses the keyword as unexpected, so those tests are red
      # at `09260ad4` and green here, and the pin and those tests move
      # together. Until that pull request lands, nothing in the pack reaches
      # the keyword, and this move is only ahead of it, never behind. The
      # same commit rewrites the refusal a blocked acknowledge
      # raises: it still opens with `resolve the report's followups before
      # acknowledging it`, the substring `tests/test_sd_controls.py` asserts,
      # and now names each blocking note as `sd note resolve <id>`. The move
      # is migration-free: `09260ad4..9d86f092` touches nothing under
      # `sd_db/schema` and `SCHEMA_VERSION` stays 9. Of the other twenty-nine
      # commits in that range, ten change `sd_db`, and the ones that could
      # reach a pack test: `workflow.item_state` and the revision hash encode
      # a BLOB `fields` or `body` through `workflow.json_safe` instead of
      # raising (sd:870, #388, `d0fb3ff`; `bin/sd_work.py` reads
      # `item_state`), `runner.heartbeat_state` refuses a heartbeat row that
      # is not a JSON object as `SdDbError` (sd:934, #392, `a681a9a`;
      # `bin/sd_runner.py` reads it), the control gate in `operations` keeps
      # the opener's sentence for a lock it cannot open and relabels only a
      # held one (sd:835, #378, `c3391c3`; `bin/sd_operations.py`), `ship`
      # takes its repository lock through `runner_journal.lock`, the one
      # hardened opener (sd:832, #377, `269531c`; sd:857, #382, `e8def66`;
      # `bin/sd-ship` merges through `sd_db.ship`), and `shadow_jira`
      # refuses every non-ASCII `JIRA_BASE_URL` host (sd:817, #363,
      # `2e323f7`; `sd shadow sync` forwards into it). The other four change
      # only what nothing in `bin/` imports: `runner_exec` (sd:814, #368,
      # `1be6f40`; sd:820, #371, `446ae91`, a docstring), `backup` (sd:779,
      # #366, `c4a77ef`) and `removal` with `runner_retention` (sd:770, #364,
      # `2655a93`). The rest do not touch `sd_db`.
      #
      # The move before that was for sd:809
      # (#360, `09260ad4`): `followup` leaves `workflow.REPO_LESS_KINDS`, so
      # `sd task add --kind followup` in a registered checkout records it, and
      # `workflow.edit_item` edits a followup's title, body, priority, due date
      # and repository. `bin/sd_work.py` reads the set from the library and
      # keeps no copy, so `tests/test_sd_work.py`'s followup tests are red at
      # `dc03956e` and green here, and the pin and those tests move together.
      # The same commit adds `runner.RUNNABLE_KINDS`, which `sd run` now meets
      # through `runner.enqueue`: a followup carrying a repository and a
      # branch is refused by kind. The move is
      # migration-free: `dc03956e..09260ad4` touches nothing under
      # `sd_db/schema` and `SCHEMA_VERSION` stays 9. Of the other thirty
      # commits in that range, the ones that change `sd_db`: the Jira
      # collector and its base URL checks (sd:361, #338, #339; sd:771, #345;
      # sd:784, #353; sd:797, #359; `shadow_sync`, `shadow_jira`), followup
      # and personal items taking the task statuses and the status control
      # alone (sd:768, #341; sd:772, #344; `workflow`), which
      # `bin/sd_work.py` reads, bulk acknowledgement of clean reports and an
      # `ingest` that takes an actor and a record (sd:755, #347; `reporting`,
      # which `bin/sd_controls.py` ingests through, and `retention`), the
      # remove plan (sd:754, #350; `removal`) and the night's setup refusals
      # (sd:805, #358; `runner_exec`). The rest do not touch `sd_db`.
      #
      # The move before that was for sd:743
      # (#332, `dc03956e`): `workflow.edit_item` accepts `kind`, guarded to
      # `workflow.HAND_KINDS`, and `workflow` now names `HAND_KINDS` and
      # `REPO_LESS_KINDS`. `bin/sd_work.py` reads both from the library in
      # place of its own `ADD_KINDS` and `REPO_LESS_KINDS`, and `sd task edit
      # --kind` passes `kind` to `edit_item`; `fd07ea9c` has neither constant
      # and refuses `kind` as a field, so the pin and that verb move together,
      # and `tests/test_sd_work.py` binds them. The move is migration-free:
      # `fd07ea9c..dc03956e` touches nothing under `sd_db/schema` and
      # `SCHEMA_VERSION` stays 9. Of the other three commits in that range,
      # none can reach a pack test: the dashboard's resource views (sd:758,
      # #329, `c943cd4`) and ports (sd:756, #330, `b16f1e1`) change only
      # `local-project-dashboard`, and #331 (`39bbfcd`) changes only
      # `local-sd-db/tests/test_contributions.py`, which the built `sd_db`
      # this job installs does not carry.
      #
      # The move before that was for sd:749
      # (#322, `fd07ea9c`): the operator verbs lose their `who` default, and
      # `writing.import_pieces` and `runner_controls.invoke_service` gain a
      # `who` with none. `bin/sd_writing.py` and `bin/sd_runner.py` now pass
      # one at those two calls, which `fb57ae56` rejects because it has no
      # `who` there, so the pin and those calls move together;
      # `tests/test_sd_writing.py` and `tests/test_sd_runner.py` bind them
      # against the library's own signatures. The move is migration-free:
      # `fb57ae56..fd07ea9c` touches nothing under `sd_db/schema` and
      # `SCHEMA_VERSION` stays 9. Of the other eight commits in that range,
      # the ones that could reach a pack test: a report replay answers from
      # the item it filed and an older run cannot rewrite current health
      # (sd:757, #326, `a75693d`, `reporting`, which `bin/sd_controls.py`
      # ingests through), a closed-unmerged pull request takes the closed
      # lane (sd:750, #328, `d99d7aa`, `contributions`, which `sd task
      # contribution` reads), and a local `main` is a working branch when the
      # default is `dev` (sd:653, #321, `b065db2`, `jobs.cli`, whose
      # `_working_branch` `bin/sd_work.py` mirrors). Of the rest, one changes
      # only a docstring in `sd_db.shadow_sync` (#320), and the runner's
      # process table (#325), the dashboard's ports (#324, #327) and the
      # system repository's own test launchers (#323) are not in the `sd_db`
      # this job installs.
      #
      # The move before that was for the heartbeat sd:739 (`ac7afd0`) gave a
      # quiet cron tick. A clean tick now records a `state` heartbeat and
      # files no report item, so `reports ingest` returns
      # `recorded` and no `item`; `tests/test_sd_controls.py` asserts that
      # shape (sd:748), and `758dfb48` predates it. That is this asymmetry
      # running the other way: the old test expected a report item from a
      # clean tick, so it was green here and red on every local venv, and the
      # corrected test was red here and green locally. The move before that
      # was for the issue collector sd:360 step 6 reads -- #306 reads an issue
      # and its timeline, #307 lets a contribution row hold one, #308 watches
      # it -- none of which `940c045a` carries. Before that it was
      # `Synced.queued` and `Synced.incomplete`, which `sd shadow sync`
      # forwards and `3c4c723a` predates: a test constructing
      # `Synced(queued=3)` passes on every local venv and can only fail here,
      # which is the asymmetry this pin creates whenever it lags what the pack
      # has started using.
      #
      # `fb57ae56` was not migration-free, unlike the move before it.
      # `009_personal_and_followup_kinds.sql` (sd:730, `6af3a4b`) moves
      # `SCHEMA_VERSION` from 8 to 9 and adds `personal`, `followup` and the
      # two idea kinds to `item.kind` (with matching `reads` and `runner`
      # changes), so a database this library opens has to be at 9. The pack
      # already depends on 009: `sd task add --kind personal|followup|work-idea|
      # personal-idea` (sd:730) fails `758dfb48`'s `item.kind` CHECK, so
      # `tests/test_sd_work.py`'s two kind tests were red at the old pin as
      # well. Of the other nine commits in `758dfb48..fb57ae56`, the ones that
      # could reach a pack test: `reporting.acknowledge` no longer has a default
      # `who` (sd:747, `fd8281b`; `bin/sd_controls.py` already passes one), a
      # clean run report
      # is no longer counted as backlog in `reads` (sd:708, `1263e46`), the
      # nightly backup checks that rows point at rows that exist (sd:744,
      # `84cb4ea`), and `sd_db.shadow_jira` is new (`b05d684`). The rest are
      # dashboard and documentation commits that do not touch `sd_db`.
      #
      # `717b8e32` is migration-free (`SCHEMA_VERSION` 9 at both pins). Of
      # the twelve `sd_db` commits in `4b240d28..717b8e32`, the one the pack
      # is about to reach is `sd_db.calls` (sd:234, `1d889eb`): pull request
      # #1012 (sd:788 slice 3, open when this pin moved) has `bin/sd-review`
      # charge every url call through `calls.call`, and its
      # `tests/test_sd_review_ledger.py` imports the module; at the old pin
      # that leg was red. Nothing on main at this commit imports `calls`, so
      # this bump changes no result here. The rest are the ledger's
      # exact-fill check (sd:965), `set_cap` and the capped usage reads
      # (sd:234), `budget_usd` refused on a start author (sd:235), and the
      # remove verbs (sd:754), none of which a pack test constructs.
      #
      # `f6761300` is one `sd_db` commit past `717b8e32`, system #445 (sd:788
      # slice 4a): `sd_db.meter.latest`, the newest `meter` row for a bill
      # and window across months. sd:788 slice 4b has `bin/sd-review` read
      # it at review start; nothing on main at this commit imports it, so
      # this bump changes no result here. Migration-free: `SCHEMA_VERSION`
      # 9 at both pins.
      #
      # `341c5f2c` is **the first pin here that carries a migration**, and the
      # first bump this repository's own tests demanded rather than tolerated.
      # System #458 renames `repo.merge_policy` to `repo.runner_merge` and
      # takes `SCHEMA_VERSION` 9 -> 10 (`010_runner_merge.sql`). `upsert_repo`
      # renames the keyword with the column, so the three `upsert_repo` calls
      # and the one `SELECT` in `tests/test_sd_ship.py` and
      # `tests/test_guest_artifact_refusal.py` cannot say both spellings: the
      # pin and those four sites move in one commit or one of the two
      # environments is red. Before this, `main` was green here on the old
      # spelling and red on every developer machine whose database had been
      # migrated -- the pin hiding a break rather than a bump causing one.
      #
      # #458 also moves a dict key on a function this repository calls:
      # `sd_db.runner.merge_authority` returns `runner_merge` where it
      # returned `merge_policy`. `bin/sd-ship:869` reads `work_path` and
      # `item` off that dict and neither spelling appears anywhere in `bin/`,
      # so nothing here observes it -- but the rename is a column, a keyword
      # and a returned key, not the first two alone.
      #
      # Of the other two `sd_db` commits in `55c4d691..341c5f2c`, #471 widens
      # `sd_db.calls` to a loopback entry that declares no key variable and
      # #453 touches `sd_db.backup`; no pack test constructs either.
      #
      # `c50e74f6` (sd:1381) takes `SCHEMA_VERSION` 10 -> 13 across three
      # migrations: `011_judgment.sql`, `012_recurrence.sql` (#542) and
      # `013_state_by_kind_key.sql` (#549). The old pin sat three schema
      # versions behind every machine for three days, green, because nothing
      # compared it with anything. `tests/test_system_pin.py` now does: it
      # fails when this ref's `SCHEMA_VERSION` differs from the installed
      # library's. In this job the library comes from this ref, so it holds
      # here by construction; on a machine whose venv is installed from system
      # `main`, the next `make check` goes red the day a migration lands there
      # and not here. The fourteen `sd_db` commits in `341c5f2c..c50e74f6`
      # are the library each machine already runs: the operator's venv was
      # byte-identical to `c50e74f6` when this moved, and `make check` passed
      # against it. `c50e74f6` is the newest system commit that touches
      # `local-sd-db`.
      #
      # `78e43d8b` (system #554, sd:1439) takes `SCHEMA_VERSION` 13 -> 14 with
      # `014_home_relative_repo_paths.sql` and adds `sd_db.paths`: a repository
      # under `$HOME` is stored as `~/<relative>`, so a second machine with
      # another login reads the same rows. The pack's lookups go through it
      # (`sd_lib.stored_repo`, `repo_row`, `same_repo`, `repo_disk`), and
      # `tests/test_home_relative.py` drives them under a second home, which
      # needs the library to carry the conversion.
      #
      # `5fb29ef2` (system #619, sd:1619) takes `SCHEMA_VERSION` 14 -> 15 with
      # `015_repo_managed.sql`: `repo.managed`, a 0/1 flag set only by
      # `sd-db.sh repo managed PATH yes|no`, and `repo list --managed`.
      # `repo list` rows now read `path remote status_source managed
      # runner_merge`; `runner_merge` stays last. No pack surface parses that
      # output: `bin/sd_fleet.py`, `bin/sd-ship` and `sd_lib.repo_row` read
      # the `repo` table by column name, so the new column changes nothing
      # they see. Of the other `sd_db` commits in `78e43d8b..5fb29ef2`, the
      # ones a pack surface calls into: `sd_db.ledger` keeps `MONEY_NOISE` for
      # `bin/sd-review` (#583) while the ledger compares money as exact
      # decimals and `sd_db.calls` prices in `Decimal` (#579); `sd_db.progress`
      # compares remotes as host/owner/name (#565), matches pre-014 keys
      # (#561) and reads issue keys (#595); `repos.checkouts` seeds from the
      # common conf as well. The rest (`remote`, `serve`, `hub`,
      # `protection`, `shadow_jira`, backup) is new or system-only code that
      # no pack test constructs.
      - name: Check out the system checkout, for sd_db
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: platypeeps/system
          # Schema 15; `tests/test_system_pin.py` holds it to the installed library.
          ref: 5fb29ef2c3cc26b845296d946b8128912da003d0
          token: ${{ secrets.SYSTEM_REPO_TOKEN }}
          path: system-checkout
          persist-credentials: false

      - name: Put it where the installer looks
        shell: bash
        run: |
          mkdir -p "$HOME/repos"
          mv system-checkout "$HOME/repos/system"

      - name: Install test dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt

      # A built copy, never `-e`: an editable install would resolve into the
      # checkout above, and a branch switch there would change this pack's
      # library under its feet. That is B's criterion 1, and
      # `test_sd_skill.TheHarnessIsImportableHere` asserts it.
      - name: Install sd_db from that checkout
        run: python3 -m pip install "$HOME/repos/system/local-sd-db"

      # `tests/test_sd_review_opencode.py::TheEscapeIsClosedLive` skips without
      # opencode, and the `Fail on skipped tests` step below turns that skip
      # into a red run. So CI installs it. The script pins the version and its
      # checksum, once for both jobs that call it, and says why and how to bump.
      - name: Install opencode (pinned, checksum-verified), so the live confinement test runs
        shell: bash
        run: bash .github/scripts/install-opencode.sh

      - name: Run tests
        # Shards the suite across workers, one shard per module except the
        # slow modules the script splits by test id (coverage --parallel-mode
        # writes one data file per shard for the combine step below). The
        # runner sets the absolute coverage env so installer subprocesses
        # launched from temp cwds still load the config and land their shards
        # where combine finds them.
        shell: bash
        run: bash .github/scripts/run-tests.sh

      - name: Fail on skipped tests
        shell: bash
        run: |
          if grep -Eq 'skipped=[1-9][0-9]*' unittest-output.log; then
            echo "Tests skipped under CI; install required tools or make the skip explicit."
            exit 1
          fi

      - name: Combine coverage data
        run: python3 -m coverage combine

      - name: Report installer coverage (gate 100%)
        run: bash .github/scripts/check-installer-coverage.sh

  # sd:1542: the unittest job installs `sd_db` at a pinned system commit, so
  # a system change that removes a name the pack imports reaches no pack CI
  # run until someone moves the pin. #579 did that with `MONEY_NOISE`, and
  # the first signal was every local gate failing. This job runs the same
  # suite against system `main`. It is an early warning, never a gate:
  # `continue-on-error` keeps it off the merge path, and a red run here
  # names the system commit to adapt to before the pin moves.
  # `tests/test_system_pin.py` goes red here by design whenever `main`
  # carries a newer `SCHEMA_VERSION` than the pin.
  sd-db-main-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, as in the unittest job: the archive test
          # resolves a commit a shallow clone cannot reach.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Check out system main, for sd_db
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: platypeeps/system
          ref: main
          # The whole history: test_system_pin reads SCHEMA_VERSION at the
          # pinned commit, which a shallow clone of main cannot reach.
          fetch-depth: 0
          token: ${{ secrets.SYSTEM_REPO_TOKEN }}
          path: system-checkout
          persist-credentials: false

      - name: Put it where the installer looks
        shell: bash
        run: |
          mkdir -p "$HOME/repos"
          mv system-checkout "$HOME/repos/system"
          git -C "$HOME/repos/system" log -1 --format='sd_db from system main at %H' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install test dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt

      - name: Install sd_db from system main
        run: python3 -m pip install "$HOME/repos/system/local-sd-db"

      # sd:1557. The same pinned opencode as the unittest job, so the skip gate
      # below does not trip on a test that skips only for want of the binary.
      - name: Install opencode (pinned, checksum-verified), so the live confinement test runs
        shell: bash
        run: bash .github/scripts/install-opencode.sh

      - name: Run tests against system main
        shell: bash
        run: bash .github/scripts/run-tests.sh

      # sd:1557. A system `main` that loses a capability a test skips on would
      # otherwise leave this job green, which is the signal it exists to give.
      - name: Fail on skipped tests
        shell: bash
        run: |
          if grep -Eq 'skipped=[1-9][0-9]*' unittest-output.log; then
            echo "Tests skipped against system main; install required tools or make the skip explicit."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not shallow: the docs lint's rule 2 asks git whether each open item
          # was delivered, and `delivered()` answers `unknown` for a shallow
          # clone, which rule 2 does not check. Full history is what makes the
          # reduced git coverage the comment below describes actually happen.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-security.txt

      # Both pinned sets in one resolve, which is also what `make setup` does.
      # The one package they share, pyyaml, is pinned to the same version and
      # hash in each file; `--require-hashes` would refuse the install if that
      # ever stopped being true, which is the right direction to fail.
      - name: Install lint and security dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt -r requirements-security.txt

      # Scope comes from the Makefile so there is exactly one definition of it.
      # This step used to restate the path list and had drifted: it covered no
      # bin/ file at all, so every tool added there was lint-clean locally and
      # unlinted here. Read the scope, do not restate it.
      - name: Ruff (pack Python)
        run: python3 -m ruff check $(make -s lint-ruff-paths)

      - name: Mypy (pack Python)
        run: python3 -m mypy $(make -s lint-mypy-paths)

      # The docs lint runs here and not in the unittest job: the tests lint
      # fixture repositories they build, never this checkout's own docs/work.
      # It reads sd_lib and the tree, so the lint job's dependencies suffice.
      # No runner has the database, so rule 2 reads each open item's status
      # from git here and checks fewer items than `make check` does on a
      # machine with the rows; the run's `rule 2 status source:` line says
      # which happened. Installing sd_db would not change that: a library
      # with no database file to open answers the same way.
      #
      # On a pull request the linter also reads the body: rule 5 (exactly one
      # `Work:` line) and rule 8 (the scope line a changed path demands, read
      # from the table in .github/copilot-instructions.md) run only under
      # --pr-body, and until sd:992 nothing here passed it. #1024 and #1027
      # both changed this file and merged without a `CI/review scope:` line;
      # the reviewer asked for it on each and a request is not a gate. The
      # body reaches the script through the environment, never through
      # `${{ }}` inside it: it is attacker-controlled text.
      #
      # The changed paths come from the merge ref this job checks out. Its
      # first parent is the base branch and its second is the pull request's
      # head, so `HEAD^1 HEAD` is what this pull request adds and nothing the
      # base has gained since. The two other spellings are wrong in opposite
      # directions. `origin/HEAD` reads nothing: a checkout on main diffs to
      # itself and passes, which is how the #1024 request was misread as a
      # false positive. `github.event.pull_request.base.sha` reads too much:
      # the payload freezes it at the base tip the pull request was opened
      # against, so every later merge into the base widens this pull request's
      # apparent scope, and rule 8 then demands a scope class for a file
      # somebody else changed. That is sd:1401, and it bricked #1151 -- a body
      # that could not be made to pass without claiming scope it did not have,
      # on a branch whose own diff was two files. The merge ref carries no
      # such drift, because GitHub recomputes it against the current base. A
      # `HEAD^2` that does not resolve means this is not the merge ref, and
      # the step fails there rather than diffing against something else.
      # A push to main has no body and runs the tree rules alone, as before.
      #
      # `PR_BODY` comes from the stored event payload, and `on: pull_request`
      # with no `types:` fires on `opened`, `synchronize` and `reopened` --
      # not on `edited`. So a body that fails rule 5 or rule 8 cannot be
      # cleared by editing it: the edit fires no event, and a re-run replays
      # the payload the first run saw, body and all. Push a commit or reopen
      # the pull request. Adding `edited` to the trigger would re-run this
      # whole workflow on every body tweak, which is why it is not here.
      - name: Docs lint (docs/work, docs/spec, docs/decisions)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            python3 bin/sd-docs-lint
            exit 0
          fi
          body="$RUNNER_TEMP/pr-body.md"
          printf '%s' "${PR_BODY:-}" > "$body"
          if ! git rev-parse --verify --quiet HEAD^2 >/dev/null; then
            echo "docs lint: HEAD has no second parent, so this checkout is" \
                 "not the pull request merge ref and the changed paths" \
                 "cannot be read from it" >&2
            exit 1
          fi
          changed="$RUNNER_TEMP/pr-changed.txt"
          git diff --name-only --no-renames HEAD^1 HEAD > "$changed"
          python3 bin/sd-docs-lint --pr-body "$body" --changed "$changed"

      # The three steps below were the `security` job until sd:10 criterion 17
      # folded them in here. Same commands, same pins, same scanner set; what
      # changed is that they no longer pay a second checkout, a second Python
      # and a second dependency install to run for well under a minute. The
      # same change removed the `bash 3.2 syntax` job from this file: it built
      # bash 3.2 from source to parse this repository's own three scripts under
      # `.github/scripts/`, a premise that stopped being true when the shipped
      # shell was deleted. No job here runs that gate now; `make lint` still
      # parses the three scripts with `/bin/bash` on the maintainer's macOS,
      # which is the interpreter the check was ever about.
      #
      # Scans pack-owned Python only. After step 3e that is bin/: nothing is
      # shipped into consumer repos any more, so "shipped Python" and "the
      # tools this repo owns" became the same set. The unshipped test suite
      # stays out of scope; the gate blocks on medium+ severity so
      # subprocess-to-git/gh Low findings stay advisory.
      - name: Bandit (pack Python)
        run: bandit -q -r --severity-level medium bin

      - name: Zizmor (workflow security)
        run: zizmor --offline .github/workflows/

      # The step above prints "No findings to report. Good job! (3
      # suppressed)", and nobody wrote those suppressions: there is no zizmor
      # configuration file in this repository and no `# zizmor: ignore`
      # comment in any workflow. The three are findings whose persona the
      # default gate drops, and until sd:876 the only place they were written
      # down was a sentence in a tracked-work note, which is a list and ages
      # like one. This asks zizmor for the set and requires it to match the
      # decisions in the script, in both directions -- so a workflow edit that
      # earns a fourth one fails here, and so does a decision whose finding is
      # gone. `make audit` runs the same pair locally.
      # `if:` because a step's default condition is `success()`, which would
      # skip this on exactly the runs where a workflow changed enough to redden
      # the step above -- the runs whose persona-gated set is most likely to
      # have moved. `!cancelled()` runs it anyway and still reports its own
      # status, so the job fails for both reasons rather than for the first.
      - name: Zizmor persona-gated findings (enumerated, not recited)
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/check-zizmor-personas.py --zizmor zizmor

      # Consumers vendor ~6k lines of pack shell and exempt it from line
      # review ("reviewed upstream"), so upstream lint rigor is the
      # compensating control. Warning severity is the achieved baseline;
      # keep it there.
      # `--deduplicate`: an unmerged path is listed once per merge stage, which
      # would lint one script three times and print each finding three times.
      # CI checks out a merged tree so this lane does not meet a conflict, but
      # the line is copied into local sweeps that do (item 481).
      - name: Shellcheck (pack shell)
        run: git ls-files -z --deduplicate '*.sh' | xargs -0 shellcheck -S warning

      # A report, never a gate. R11-D48 retired `bin/`'s line-count ceiling
      # because a total that has to be raised to let work proceed never says
      # no; what replaced it is four numbers and their movement, printed where
      # whoever reads the pull request will see them. `continue-on-error` is
      # the mechanical half of "never a gate": this step cannot redden a run
      # even by crashing, so nobody is ever tempted to make its numbers
      # agreeable. It runs in this job rather than the unittest one because
      # the trend reads thirty days of history and this is the checkout with
      # `fetch-depth: 0` and no matrix.
      - name: Report bin/ size (never a gate)
        continue-on-error: true
        run: python3 bin/sd-size-report | tee -a "$GITHUB_STEP_SUMMARY"
