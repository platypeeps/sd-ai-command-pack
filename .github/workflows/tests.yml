name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          # macOS is dropped for the duration of the artifacts-as-product
          # rollout (R11-D4). Restored at step 7, where "verify protection"
          # already sits on the checklist.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt

      - name: Run tests
        # Shards the suite by module across workers (coverage --parallel-mode
        # writes one data file per shard for the combine step below). The
        # runner sets the absolute coverage env so installer subprocesses
        # launched from temp cwds still load the config and land their shards
        # where combine finds them.
        shell: bash
        run: bash .github/scripts/run-tests.sh

      - name: Fail on skipped tests
        shell: bash
        run: |
          if grep -Eq 'skipped=[1-9][0-9]*' unittest-output.log; then
            echo "Tests skipped under CI; install required tools or make the skip explicit."
            exit 1
          fi

      - name: Combine coverage data
        run: python3 -m coverage combine

      - name: Report installer coverage (gate 100%)
        run: bash .github/scripts/check-installer-coverage.sh

      - name: Report shipped-scripts coverage
        run: bash .github/scripts/check-shipped-script-coverage.sh

      - name: Check shipped-script doc coverage
        run: bash .github/scripts/check-shipped-script-docs.sh

      - name: Check pack-helper resolution rule
        run: python3 .github/scripts/check-helper-resolution.py

      - name: Check shipped-script modes
        run: python3 .github/scripts/check-shipped-script-modes.py

  shell-coverage:
    name: Shell coverage
    runs-on: ubuntu-latest
    # kcov wraps every bash the suite spawns, so the run is ~10 min plus the
    # from-source kcov build; give it headroom over the standard 15.
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt

      - name: Install kcov
        # kcov is no longer packaged for Ubuntu 24.04, and the prebuilt v42
        # binary links libopcodes-2.38 (binutils 2.38), absent on noble
        # (binutils 2.42). Build from a pinned kcov commit instead so the
        # binary is ABI-correct for whatever runner image is current. The
        # clone is pinned by asserting HEAD equals the expected commit, and
        # `kcov --version` smoke-tests the built binary.
        env:
          KCOV_REPO: https://github.com/SimonKagstrom/kcov.git
          KCOV_REF: v43
          KCOV_COMMIT: a39874f938ce13f7a65f253120d1ec946b349ffe
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            binutils-dev libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev libssl-dev
          git clone --depth 1 --branch "$KCOV_REF" "$KCOV_REPO" /tmp/kcov-src
          got="$(git -C /tmp/kcov-src rev-parse HEAD)"
          if [ "$got" != "$KCOV_COMMIT" ]; then
            printf 'error: kcov %s resolved to %s, expected %s\n' \
              "$KCOV_REF" "$got" "$KCOV_COMMIT" >&2
            exit 1
          fi
          cmake -S /tmp/kcov-src -B /tmp/kcov-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kcov-build
          sudo cmake --install /tmp/kcov-build
          kcov --version

      - name: Measure shipped shell coverage
        # Routes the bash the subprocess tests spawn through kcov-bash-shim.sh
        # so kcov records which lines of the shipped shell the suite reaches.
        # This is a measurement-only lane: no floor is enforced (measure before
        # gating), and the report step fails only on a zero-line measurement.
        env:
          SD_AI_COMMAND_PACK_TEST_BASH: ${{ github.workspace }}/.github/scripts/kcov-bash-shim.sh
          SD_AI_COMMAND_PACK_REAL_BASH: /usr/bin/bash
          SD_AI_COMMAND_PACK_KCOV_DIR: ${{ runner.temp }}/kcov-shell
          SD_AI_COMMAND_PACK_KCOV_INCLUDE: sd-ai-command-pack-
        run: |
          set -euo pipefail
          mkdir -p "$SD_AI_COMMAND_PACK_KCOV_DIR"
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Report shipped shell coverage
        if: always()
        env:
          SD_AI_COMMAND_PACK_KCOV_DIR: ${{ runner.temp }}/kcov-shell
        run: bash .github/scripts/report-shell-coverage.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install lint dependencies
        run: python3 -m pip install --require-hashes -r requirements-dev.txt

      # Scope comes from the Makefile so there is exactly one definition of it.
      # This step used to restate the path list and had drifted: it covered no
      # bin/ file at all, so every tool added there was lint-clean locally and
      # unlinted here. Read the scope, do not restate it.
      - name: Ruff (pack Python)
        run: python3 -m ruff check $(make -s lint-ruff-paths)

      - name: Mypy (pack Python)
        run: python3 -m mypy $(make -s lint-mypy-paths)

      - name: Review preflight JavaScript syntax
        run: node --check templates/scripts/sd-ai-command-pack-review-preflight.mjs

      - name: OpenCode JavaScript syntax
        run: bash .github/scripts/check-opencode-js.sh

  bash32:
    name: bash 3.2 syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # macOS ships bash 3.2 as /bin/bash, so every shipped script has to parse
    # under it. Until now nothing in CI checked that: the gate ran only in a
    # local `make lint`, and the macOS unittest leg -- now dropped by R11-D4 --
    # never invoked this script even when it existed. So the constructs bash 3.2
    # rejects reached main unchallenged whenever the maintainer's local run was
    # skipped.
    #
    # Linux carries no bash 3.2, so the gate would skip silently here. This job
    # builds one and runs the gate under STRICT=1, which turns a missing
    # interpreter into a failure rather than a pass.
    env:
      BASH32_VERSION: "3.2.57"
      # Pinned so the gate cannot be changed by whatever the mirror serves.
      # A CI gate that builds an unverified download is a gate an upstream
      # change can silently redefine.
      BASH32_SHA256: "3fa9daf85ebf35068f090ce51283ddeeb3c75eb5bc70b1a4a7cb05868bfe06a4"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore bash 3.2
        id: bash32-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bash32
          key: bash32-${{ env.BASH32_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build bash 3.2
        if: steps.bash32-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bison
          work="$(mktemp -d)"
          curl -fsSL -o "$work/bash.tar.gz" \
            "https://ftp.gnu.org/gnu/bash/bash-${BASH32_VERSION}.tar.gz"
          echo "${BASH32_SHA256}  $work/bash.tar.gz" | sha256sum -c -
          tar xzf "$work/bash.tar.gz" -C "$work"
          cd "$work/bash-${BASH32_VERSION}"
          ./configure --without-bash-malloc --disable-nls -q
          # bash 3.2 is from 2006 and predates C99-as-default; a current gcc
          # rejects its declarations without the older dialect. It also predates
          # aarch64, whose config.sub it cannot recognise -- fine on the x86_64
          # runners, and the reason this job does not use a matrix.
          #
          # -j1 is deliberate. Its Makefile races under parallel make: a -j$(nproc)
          # build failed here once and succeeded twice, which is the worst
          # possible behaviour for a gate. The result is cached, so the serial
          # build is paid once per version, not once per run.
          make -j1 CFLAGS="-O1 -std=gnu89 -Wno-implicit-function-declaration -Wno-return-mismatch"
          mkdir -p "$HOME/.cache/bash32"
          install -m 0755 ./bash "$HOME/.cache/bash32/bash"

      # Never run the gate against an interpreter that is not actually bash 3.2:
      # a wrong binary here would turn the whole job into a green no-op.
      - name: Verify the interpreter is bash 3.2
        run: |
          set -euo pipefail
          version="$("$HOME/.cache/bash32/bash" --version | head -n 1)"
          echo "$version"
          case "$version" in
            *"version ${BASH32_VERSION}"*) ;;
            *) echo "::error::not bash ${BASH32_VERSION}; refusing to run the gate" >&2
               exit 1 ;;
          esac

      - name: bash 3.2 syntax gate
        env:
          STRICT: "1"
        run: |
          set -euo pipefail
          SD_AI_COMMAND_PACK_BASH32="$HOME/.cache/bash32/bash" \
            bash .github/scripts/check-bash32-syntax.sh

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-security.txt

      - name: Install security scanners
        run: python3 -m pip install --require-hashes -r requirements-security.txt

      # Scans pack-owned shipped Python only. Trellis-vendored hook adapters
      # and the unshipped test suite are out of scope; the gate blocks on
      # medium+ severity so subprocess-to-git/gh Low findings stay advisory.
      - name: Bandit (shipped Python)
        run: bandit -q -r --severity-level medium install.py installer templates/scripts

      - name: Zizmor (workflow security)
        run: zizmor --offline .github/workflows/

      # Consumers vendor ~6k lines of pack shell and exempt it from line
      # review ("reviewed upstream"), so upstream lint rigor is the
      # compensating control. Warning severity is the achieved baseline;
      # keep it there.
      - name: Shellcheck (pack shell)
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
